services:
  - type: web
    name: smart-gen-backend
    runtime: python
    # `free` (512MB) OOMs loading the InsightFace model even on the
    # smaller buffalo_s pack — see README.md's Deployment section.
    # `standard` = 2GB, the minimum that's actually been confirmed to
    # hold the model in memory.
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
